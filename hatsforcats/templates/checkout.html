{% extends 'base.html' %}
{% load static %}

{% block content %}
  <link href="{% static  'css/checkout.css' %}" rel="stylesheet" />
  <main>
    <div class="basket-container">
      <div class="main-content">
        <div class="left-section">
          <h1>CHECKOUT</h1>
          <div class="info-box">
            <div class="info-items">CURRENTLY DELIVERING TO:</div>
            <a href=""><div class="keep-shopping">Change delivery address</div></a>
          </div>
  
          <div class="ask-question">
            <form method='post' action='' enctype='multitype/form-data'>  
                {% csrf_token %}
                <div class="name">
                  <input type="text" placeholder="Name">
                </div>
                <div class="house-number">
                  <input type="text" placeholder="House Number & Street">
                </div>
                <div class="area">
                  <input type="text" placeholder="Area">
                </div>
                <div class="city">
                  <input type="text" placeholder="City">
                </div>
                <div class="postcode">
                  <input type="text" placeholder="Postcode">
                </div>
                <div class="payment-method">
                  <div class="payment-method-line"></div>
                  <div class="payment-method-text">Payment</div>
                  <div class="payment-method-line"></div>
                </div>
                <div class="filterButtons">
                  <button type="button" class="filter-button">Apple Pay</button>

                    <path d="M22 10H2M11 14H6M2 8.2L2 15.8C2 16.9201 2 17.4802 2.21799 17.908C2.40973 18.2843 2.71569 18.5903 3.09202 18.782C3.51984 19 4.07989 19 5.2 19L18.8 19C19.9201 19 20.4802 19 20.908 18.782C21.2843 18.5903 21.5903 18.2843 21.782 17.908C22 17.4802 22 16.9201 22 15.8V8.2C22 7.0799 22 6.51984 21.782 6.09202C21.5903 5.7157 21.2843 5.40974 20.908 5.21799C20.4802 5 19.9201 5 18.8 5L5.2 5C4.0799 5 3.51984 5 3.09202 5.21799C2.7157 5.40973 2.40973 5.71569 2.21799 6.09202C2 6.51984 2 7.07989 2 8.2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg> Debit Card </button>
              </div>
            </form>
        </div>
        </div>
        <div class="right-section">
          <div class="summary-section">
            <h2>SUMMARY</h2>
            
            <div class="summary-items">
              <div class="summary-text">Item 1</div>
              <div class="summary-text">£0.00</div>
            </div>
            <div class="summary-items">
              <div class="summary-text">Item 2</div>
              <div class="summary-text">£0.00</div>
            </div>
            <div class="summary-items-1">
              <div class="summary-text">Subtotal</div>
              <div class="summary-text">£0.00</div>
            </div>
            <div class="summary-items">
              <div class="summary-text">Shipping</div>
              <div class="summary-text">£3.99</div>
            </div>
  
            <div class="summary-items-total">
              <div class="summary-text">Total</div>
              <div class="summary-text">£3.99</div>
            </div>
  
            <button class="checkout-button">Buy Now</button>
  
          </div>
        </div>
      </div>
    </div>
  </main>


{% endblock %}
