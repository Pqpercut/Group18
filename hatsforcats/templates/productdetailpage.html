{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="{% static  'css/productdetail.css' %}" rel="stylesheet" />
<div class="main-container">
    <div class="header-container">
        <div class="product-container">
            <div class="main-image-container">
                <img src="https://via.placeholder.com/600x400/FFFFFF" alt="Main Product Image" class="main-image" id="main-image">
                <button class="arrow arrow-left" onclick="previousImage()">&#8249;</button>
                <button class="arrow arrow-right" onclick="nextImage()">&#8250;</button>
            </div>
            <div class="thumbnail-container">
                <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 1" class="thumbnail" onclick="changeMainImage(0)">
                <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 2" class="thumbnail" onclick="changeMainImage(1)">
                <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 3" class="thumbnail" onclick="changeMainImage(2)">
                <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 4" class="thumbnail" onclick="changeMainImage(3)">
            </div>
        </div>
        <div class="content-container">
            <div class="rating-container">
                <h1>{{name}}</h1>
            </div>

            <div class="text-container">
                <h2>Category Name</h2>
                <h3>£{{ product.productvariant.first.price }}</h3>
                <form method="POST" action="{% url 'variantDisplay' %}">
                    {% csrf_token %}
                    <div class="colour-container">
                        <div class="colour-selecter">
                            {% for c in colours %}            
                                <button type="button" name="colour" value="{{ c }}" class="color-circle" onclick='colourSelect("{{ c }}")' required>{{ c }}</button>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="size-container">
                        <h3>Select your size:</h3>
                        <div class="size-selecter">
                            {% for s in sizes %}
                                <button type="button" name="size" value="{{ s }}" class="size-circle" onclick='sizeSelect("{{ s }}")' data-size="{{ s }}" required>{{ s }}</button>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="quantity-container">
                        <h3>Quantity:</h3>
                        <div class="product-quantity">	                        
                                <button type="button" name="add_button" value="rem_one" class="quantity-btn-left" id="decrease" onclick="change_quantity(-1)">-</button>   
                                <input type="number" name="quantity" id="quantity-input" value="{{quantity}}" min="1" max="99">
                                <button type="button" name="add_button" value="add_one" class="quantity-btn-left" id="increase" onclick="change_quantity(+1)">+</button>
                        </div>
                    </div>
                    <input type="hidden" name="colour" id="hidden-colour">
                    <input type="hidden" name="size" id="hidden-size">
                    <input type="hidden" name="size_list" id="size_list" value="{{sizes}}">
                    <button type ="submit" name="add_button" value="add_to_basket" class="cartbutton">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="description-container">
    <p>{{desc}}</p>
</div>
<div class="suggestion-container">
    <div class="suggestion-header-container">
        <div class="suggestion-header">
            <h1>You May Also Like</h1>
        </div>
        <div class="suggestion-arrow">
            <h1>></h1>
        </div>
    </div>
    <div class="suggestion-img-container">
        <img src="https://via.placeholder.com/240x220/FFFFFF" alt="Product 1" class="alt-product">
        <img src="https://via.placeholder.com/240x220/FFFFFF" alt="Product 2" class="alt-product">
        <img src="https://via.placeholder.com/240x220/FFFFFF" alt="Product 3" class="alt-product">
        <img src="https://via.placeholder.com/240x220/FFFFFF" alt="Product 4" class="alt-product">
    </div>
</div>

<script>
    const available_sizes = {
        {% for c, sizes_list in sizes_map.items %}
            "{{ c }}": {{ sizes_list|safe }},
        {% endfor %}
    };
</script>

<script src="{% static 'productdetail.js' %}"></script>
{% endblock %}
