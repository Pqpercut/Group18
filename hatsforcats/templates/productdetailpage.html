{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail Page</title>
    <link rel="stylesheet" href="{% static 'css/productdetail.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="header-container">
            <div class="product-container">
                <div class="main-image-container">
                    <img src="https://via.placeholder.com/600x400/FFFFFF" alt="Main Product Image" class="main-image" id="main-image">
                    <button class="arrow arrow-left" onclick="previousImage()">&#8249;</button>
                    <button class="arrow arrow-right" onclick="nextImage()">&#8250;</button>
                </div>
                <div class="thumbnail-container">
                    <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 1" class="thumbnail" onclick="changeMainImage(0)">
                    <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 2" class="thumbnail" onclick="changeMainImage(1)">
                    <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 3" class="thumbnail" onclick="changeMainImage(2)">
                    <img src="https://via.placeholder.com/140x140/FFFFFF" alt="Thumbnail 4" class="thumbnail" onclick="changeMainImage(3)">
                </div>
            </div>
            <div class="content-container">
                <div class="rating-container">
                    <h1>{{name}}</h1>
                    <div class="star-rating">
                        <span class="star">&#9733;</span>
                        <span class="star">&#9733;</span>
                        <span class="star">&#9733;</span>
                        <span class="star">&#9733;</span>
                        <span class="star">&#9733;</span>
                    </div>
                </div>

                <div class="text-container">
                    <h2>Category Name</h2>
                    <h3>PRICE:</h3>
                    <div class="description">
                        <p>{{desc}}</p>
                    </div>

                    <div class="colour-container">
                        <h3>Colour:</h3>
                        <div class="colour-selecter">
                            {% for v in variants %}
                            <form method="POST" action="{% url 'variantDisplay' %}">
                            	{% csrf_token %}
                            	<button type="submit" name="colour" value="{{v.colour}}" class="color-circle" style="background-color: {{v.colour}};"></button>
                            </form>
                            {% endfor %}
                        </div>
                    </div>

                   <div class="size-container">
                    <h3>Size:</h3>
                    <div class="size-selecter">
            			{% for s in sizes %}

                    	<div class="size-circle" data-size="{{ s }}" title="{{ s }}">{{ s }}</div>

                    	{% endfor %}
                    </div>
                   </div>

                   <div class="quantity-container">
                    <h3>Quantity:</h3>
                    <div class="quantity-box">
                    	{% for v in variants %}
                    	{{v.id}}
                    	<form method="POST" action="{% url 'basketAdd' %}">
                    		{% csrf_token %}
                    		<input type="hidden" name="variantid" value="{{ v.id }}">
	                        
	                        <button type="submit" class="quantity-btn" id="decrease">-</button>
	                        
	                        <input type="number" name="quantity" id="quantity-input" value="{{quantity}}" min="1" max="99">
	                        
	                        <button type="submit" name="add_button" value="add_one" class="quantity-btn" id="increase">+</button>
                    </div>
                   </div>
                  <button type ="submit" name="add_button" value="add_to_basket" class="cartbutton">Add to Cart</button>
              			</form>
              			{% endfor %}
                </div>
            </div>
        </div>
    </div>
    <div class="suggestion-container">
        <h1>You May Also Like</h1>
    </div>
    <div class="suggestion-img-container">
        <img src="https://via.placeholder.com/200x200/FFFFFF" alt="Product 1" class="alt-product">
        <img src="https://via.placeholder.com/200x200/FFFFFF" alt="Product 2" class="alt-product">
        <img src="https://via.placeholder.com/200x200/FFFFFF" alt="Product 3" class="alt-product">
        <img src="https://via.placeholder.com/200x200/FFFFFF" alt="Product 4" class="alt-product">
    </div>
    <script src="../../Front-end-team/Product Detail Page/script.js"></script>
</body>
