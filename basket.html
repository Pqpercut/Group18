<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket</title>
    <link rel="stylesheet" href="basket.css">
</head>
<body>
    <main>
        <h1>BASKET</h1>

            <button class="items-button">3 ITEMS</button>
            <a href="#" class="wishlist-link">WISHLIST</a>

                    <div class="product-image"></div>

                        <div class="product-details">
                            <p>Price</p>
                            <p class="product-price">£0.00</p>
                        </div>
                        <p>Colour</p>
                        <p>Size</p>
                        <div class="quantity">
                            <button class="quantity-btn">-</button>
                            <input type="number" value="1">
                            <button class="quantity-btn">+</button>
                        </div>
                    </div>
                </div>

                <div class="product-item">
                    <div class="product-image"></div>
                    <div class="product-info">
                        <h3>Product Name</h3>
                        <div class="product-details">
                            <p>Price</p>
                            <p class="product-price">£0.00</p>
                        </div>
                        <p>Colour</p>
                        <p>Size</p>
                        <div class="quantity">
                            <button class="quantity-btn">-</button>
                            <input type="number" value="1">
                            <button class="quantity-btn">+</button>
                        </div>
                    </div>
                </div>

                <div class="product-item">
                    <div class="product-image"></div>
                    <div class="product-info">
                        <h3>Product Name</h3>
                        <div class="product-details">
                            <p>Price</p>
                            <p class="product-price">£0.00</p>
                        </div>
                        <p>Colour</p>
                        <p>Size</p>
                        <div class="quantity">
                            <button class="quantity-btn">-</button>
                            <input type="number" value="1">
                            <button class="quantity-btn">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="summary-section">
                <h2>SUMMARY</h2>
                <p class="Prices">Subtotal &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;£0.00
                    <br><br><br>Shipping Fee &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;£0.00<br><br><br>
                    Discount Code &emsp;&emsp;&nbsp;&emsp;&emsp;&emsp;&thinsp;&emsp;£0.00 </p>
                    
                <div class="user-input-text">
                    <input type="text" class="box" placeholder="Enter Code">
                </div>
                <button type="submit" class="Checkoutbutton">Continue to Checkout</button>
            
            </div>
        </div>
    </main>
