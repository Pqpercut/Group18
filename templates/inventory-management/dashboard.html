<!DOCTYPE html>
<html lang="en">
<head>
{% load static %}
  <meta charset="UTF-8">
  <title>Interactive Dashboard Sidebar</title>
  <link href="{% static  'css/ims/dashboard.css' %}" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Toggle Button -->
  <button class="toggle-btn" id="toggleBtn">☰</button>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>Hats for Cats</h2>
    <a href="#">Dashboard</a>
    <a href="#">Customers</a>
    <a href="#">Products</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
    <a href="#">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <header>
        <div class="sort"> 
            Sort: 
            <div class="sort-dropdown">
                <input type="text">
            </div>
        </div>
        <div class="header-right">
            <div class="notifications">
              <svg class="notifications-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.35419 21C10.0593 21.6224 10.9856 22 12 22C13.0145 22 13.9407 21.6224 14.6458 21M18 8C18 6.4087 17.3679 4.88258 16.2427 3.75736C15.1174 2.63214 13.5913 2 12 2C10.4087 2 8.8826 2.63214 7.75738 3.75736C6.63216 4.88258 6.00002 6.4087 6.00002 8C6.00002 11.0902 5.22049 13.206 4.34968 14.6054C3.61515 15.7859 3.24788 16.3761 3.26134 16.5408C3.27626 16.7231 3.31488 16.7926 3.46179 16.9016C3.59448 17 4.19261 17 5.38887 17H18.6112C19.8074 17 20.4056 17 20.5382 16.9016C20.6852 16.7926 20.7238 16.7231 20.7387 16.5408C20.7522 16.3761 20.3849 15.7859 19.6504 14.6054C18.7795 13.206 18 11.0902 18 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="profile">
                <div class="profile-image">
                    <div class="activity-icon">

                    </div>
                </div>
                <div class="profile-info">
                    <div class="profile-info-name">Adam Ahmed</div>
                    <div class="profile-info-email">adamahmed2002@icloud.com</div>
                </div>
            </div>
        </div>
    </header>
    <main>
      <h1>Dashboard</h1>
      <h2>Welcome back, User</h2>
      <div class="dashboard-row1">
        <div class="revenue">test</div>
        <div class="expenses">test</div>
        <div class="sales">test</div>
      </div>
    </main>
    <!-- Add additional content as needed -->
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      mainContent.classList.toggle('shift');
    });
  </script>
</body>
</html>
