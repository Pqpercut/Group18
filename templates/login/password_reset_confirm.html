{% extends 'base.html' %}

{% block title %}Reset Your Password{% endblock %}

{% block content %}
<main>
    <section class="password-reset-confirm">
        <h1>Reset Your Password</h1>
        <p>Please enter your new password below.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button">Reset Password</button>
        </form>
    </section>
</main>
{% endblock %}
