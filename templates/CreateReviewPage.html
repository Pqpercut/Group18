<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hats for Cats{% endblock %}</title>
    <link rel="icon" href=""> <!-- need to add -->
    <link href="{% static  'css/footer.css' %}" rel="stylesheet" />
    <link href="{% static  'css/header.css' %}" rel="stylesheet" />
    <link href="{% static  'css/base.css' %}" rel="stylesheet" />
    <link href="{% static  'css/review.css' %}" rel="stylesheet" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">

</head>
<body>
    <div class="wrapper">

    


    <form method="post">
        {% csrf_token %}
        <div class="star-rating">

          <input type="radio" name="rating" id="star1" value="1">
          <label for="star1">&#9733;</label>

          <input type="radio" name="rating" id="star2" value="2">
          <label for="star2">&#9733;</label>

          <input type="radio" name="rating" id="star3" value="3">
          <label for="star3">&#9733;</label>

          <input type="radio" name="rating" id="star4" value="4">
          <label for="star4">&#9733;</label>

          <input type="radio" name="rating" id="star5" value="5">
          <label for="star5">&#9733;</label>



          <input type="hidden" id="rating-hidden" name="rating-hidden">
          
            
        </div>
      
          <!-- Add other form fields -->
          {{ form.as_p }}  <!-- Render other fields like content or comments -->
        
        <button type="submit">Save</button>
    </form>
    </div>
</body>





 
  <script>
    // WAIT FOR ALL ELEMENTS TO BE LOADED 
    document.addEventListener("DOMContentLoaded", function() {
      // GET ALL STAR ELEMENTS
      const stars = document.querySelectorAll(".star-rating label");

      //GET ALL STAR INPUT ELEMENTS
      const radios = document.querySelectorAll(".star-rating input");
      
      resetStars();
      //ADD THE HOVER, NO HOVER AND SELECT FUNCTIONS FOR ALL STARS
      stars.forEach((star, index) => {
          star.addEventListener("mouseover", () => {
              highlightStars(index); //Highlight function called
          });
  
          star.addEventListener("mouseout", () => {
              resetStars(); // Reset the stars when mouse leaves
          });
  
          star.addEventListener("click", () => {
              selectStars(index); // Set the rating when clicked
          });
      });
  
      function highlightStars(index) {
          stars.forEach((star, i) => {
              star.style.color = i <= index ? "gold" : "lightgray"; // Highlight all stars prior to this star gold if they match the index lightgray otherwise
          }); 
      }
  
      function resetStars() {
          let selectedIndex = -1;
          radios.forEach((radio, i) => {
              if (radio.checked) {
                  selectedIndex = i;
              }
          }); //Check which star is selected
  
          stars.forEach((star, i) => {
              star.style.color = i <= selectedIndex ? "gold" : "lightgray"; // Reset color based on selection
          }); // make all stars prior to selected star gold
      }
  
      function selectStars(index) {
          radios[index].checked = true; // Mark the radio button as checked
          document.getElementById('rating-hidden').value = radios[index].value; // Update hidden input value
          
      }
  });
  </script>

</html>
