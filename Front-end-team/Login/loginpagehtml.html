<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hats for Cats - Login</title>
  <link rel="stylesheet" href="LoginStyles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">HATS FOR CATS</div>
    <nav>
      <a href="https://www.jdsports.co.uk/page/mens/">Shop</a>
      <a href="#">About</a>
      <a href="#">Login</a>
      <a href="#" class="cart-icon">🛒</a>
    </nav>
  </header>

  <!-- Login Section -->
  <main>
    <section class="login-section">
      <h1>LOGIN</h1>
      <form action="#" method="POST">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
        
        <p class="forgot-password">
          Forgot your password? Meow worries! Reset it 
          <a href="#">here</a>.
        </p>

        <div class="button-container">
          <button type="submit" class="login-button">Login</button>
          <button type="button" class="register-button">Register</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-column">
      <h3>HATS FOR CATS</h3>
    </div>
    <div class="footer-column">
      <h4>Home</h4>
      <ul>
        <li><a href="#">Shop</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Login</a></li>
      </ul>
    </div>
    <div class="footer-column">
      <h4>Shop</h4>
      <ul>
        <li><a href="#">Browse Hats</a></li>
        <li><a href="#">Best Sellers</a></li>
        <li><a href="#">New Arrivals</a></li>
      </ul>
    </div>
    <div class="footer-column">
      <h4>Contact</h4>
      <ul>
        <li><a href="#">Email</a></li>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Instagram</a></li>
        <li><a href="#">Twitter</a></li>
      </ul>
    </div>
    <div class="footer-column newsletter">
      <h4>Join Our Newsletter</h4>
      <form action="#">
        <div class="input-container">
          <input type="email" placeholder="Email Address" required>
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>    
  </footer>
</body>
</html>
