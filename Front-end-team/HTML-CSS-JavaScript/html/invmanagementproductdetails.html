<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Product Details Page</title>
    <link rel="stylesheet" href="../css/invmanagementproductdetails.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="header-container">
            <h1>Product Name</h1>
        </div>  
        <div class="form-container">
            <div class="sub-heading">
                <h2>Product Information</h2>
            </div>
            <div class="row">
                <div class="label-container">
                    <label for="description">Description</label>
                </div>
                <div class="input-container">
                    <input type="text" id="description" name="description" placeholder="Enter your text here...">
                </div>
            </div>
            <div class="row">
                <div class="label-container">
                    <label for="availability">Availability</label>
                </div>
                <div class="input-container">
                    <input type="text" id="availability" name="availability" placeholder="Availability">
                </div>
            </div>
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Size</th>
                    <th>Colour</th>
                    <th>Price</th>
                    <th>Stock Level</th>
                    <th>Update Stock</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Small</td>
                    <td>Red</td>
                    <td>$10.00</td>
                    <td>20</td>
                    <td>
                        <input type="number" class="update-stock-input" placeholder="Enter new stock">
                        <button class="action-button">Update</button>
                    </td>
                    <td><button class="action-button">View</button>
                        <span class="separator">|</span>
                        <button class="action-button">Edit</button></td>
                </tr>
                <tr>
                    <td>Medium</td>
                    <td>Blue</td>
                    <td>$12.00</td>
                    <td>15</td>
                    <td><input type="number" class="update-stock-input" placeholder="Enter new stock"><button class="action-button">Update</button></td>
                    <td><button class="action-button">View</button>
                        <span class="separator">|</span>
                        <button class="action-button">Edit</button></td>
                </tr>
                <tr>
                    <td>Large</td>
                    <td>Green</td>
                    <td>$14.00</td>
                    <td>10</td>
                    <td><input type="number" class="update-stock-input" placeholder="Enter new stock"><button class="action-button">Update</button></td>
                    <td><button class="action-button">View</button>
                        <span class="separator">|</span>
                        <button class="action-button">Edit</button></td>
                </tr>
            </tbody>
        </table>
        <div class="button-container">
            <button class="back-button">Back to List</button>
            <input type="submit" value="Add Variant">                
        </div>
</body>
</html>
