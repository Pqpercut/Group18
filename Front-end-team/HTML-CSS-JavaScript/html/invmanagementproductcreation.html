<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Product Creation Page</title>
    <link rel="stylesheet" href="../css/invmanagementproductcreation.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="header-container">
            <h1>Create New Product</h1>
        </div>  
        <div class="image-container">
            <img src="../media/image.png" alt="Main Image" class="main-image">
        </div>
        <div class="form-container">
            <div class="name-container">
                <label for="name-input">Name</label>
                <input type="text" id="name-input" name="name" placeholder="Enter the name of the product">
            </div>
            <div class="description-container">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" cols="30" placeholder="Enter your text here..."></textarea>
            </div>
            <div class="availability-container">
                <label for="availability">Availability:</label>
                <input type="checkbox" id="availability" name="availability" value="Availability">
            </div>            
            <div class="button-container">
                <button class="cancel-button">Cancel</button>
                <input type="submit" value="Create">                
            </div>
        </div>
    </div>
</body>
</html>
