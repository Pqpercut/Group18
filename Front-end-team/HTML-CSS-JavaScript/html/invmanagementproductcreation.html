<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Product Creation Page</title>
    <link rel="stylesheet" href="../css/invmanagementproductcreation.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="header-container">
            <h1>Create New Product</h1>
            <h2>You are currently creating [insert product here]</h2>
            <div class="image-container">
               <div class="image-header">
                <h2>Images</h2>
                <div class="image-spacing">
                    <img src="../media/image.png" alt="Main Image" class="main-image">
                    <img src="../media/image.png" alt="Main Image" class="main-image">
                    <img src="../media/image.png" alt="Main Image" class="main-image">
                    <img src="../media/image.png" alt="Main Image" class="main-image">
                </div>
               </div>
            </div>
        </div>
        <div class="form-container">
            <div class="sub-heading">
                <h2>Product Information</h2>
            </div>
            <div class="row">
                <div class="label-container">
                    <label for="name-input">Name</label>
                </div>
                <div class="input-container">
                    <input type="text" id="name-input" name="name" placeholder="Enter the name of the product">
                </div>
            </div>
            <div class="row">
                <div class="label-container">
                    <label for="description">Description</label>
                </div>
                <div class="input-container">
                    <input type="text" id="description" name="description" placeholder="Enter your text here...">
                </div>
            </div>
            <div class="row">
                <div class="label-container">
                    <label for="price">Price</label>
                </div>
                <div class="input-container">
                    <input type="text" id="price" name="price" placeholder="Price">
                </div>
            </div>
            <div class="row">
                <div class="label-container">
                    <label for="availability">Availability</label>
                </div>
                <div class="input-container">
                    <input type="text" id="availability" name="availability" placeholder="Availability">
                </div>
            </div>
        </div>        
        <div class="button-container">
            <button class="cancel-button">Cancel</button>
            <input type="submit" value="Create">                
        </div>
    </div>
</body>
</html>
