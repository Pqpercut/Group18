<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Variation Creation Page</title>
    <link rel="stylesheet" href="../css/invmanagementvariationcreation.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="header-container">
            <h1>Create New Variant</h1>
        </div>  
        <div class="image-container">
            <img src="../media/image.png" alt="Main Image" class="main-image">
        </div>
        <div class="form-container">
            <div class="name-container">
                <label for="name-input">Name</label>
                <input type="text" id="name-input" name="name" placeholder="Enter the name of the product">
            </div>
            <div class="name-container">
                <label for="name-input">Colour</label>
                <input type="text" id="colour-input" name="colour" placeholder="Enter the colour of the product">
            </div>
            <div class="name-container">
                <label for="name-input">Price</label>
                <input type="text" id="price-input" name="price" placeholder="Enter the price of the product">
            </div>
            <div class="name-container">
                <label for="name-input">Stock Level</label>
                <input type="text" id="stocklvl-input" name="stocklvl" placeholder="Enter the stock level of the product">
            </div>
            <div class="button-container">
                <button class="cancel-button">Cancel</button>
                <input type="submit" value="Create">                
            </div>
        </div>
    </div>
</body>
</html>
