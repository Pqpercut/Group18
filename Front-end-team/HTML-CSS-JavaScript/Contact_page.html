<body>

<div class="container">
    <h2>CONTACT FORM</h2>

        <form>
            <div class="first-row">

                <div class="Fields" id="full-name">
                    <a>
                    <label for=" full-name Name"><b>FULL NAME:</b></label>
                    <input type="text" id="full-name" name="full-name" required>
                    </a>
                    
                </div>
                
                <div class="Fields" id ="email" >
                    <label for="email"><b>EMAIL:</b></label>
                    <input type="email" id="email" name="email" required>
                </div>

            </div>
            <br>
            <br>
            

            <label for="enquiry:"><b>ENQUIRY:</b></label>
            <textarea id="enquiry" name="enquiry"></textarea>

            <button type="send"><b>SEND</b></button>
        </form>

</div>

</body>
