<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hats for Cats - Register</title>
  <link rel="stylesheet" href="RegisterStyles.css">
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- Font^ -->
  <nav>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">HATS FOR CATS</div>
    <nav>
      <a href="https://www.jdsports.co.uk/page/mens/">Shop</a>
      <a href="#">About</a>
      <a href="#">Login</a>
      <a href="#" class="cartIcon">🛒</a>
    </nav>
  </header>

  <!-- Login Section -->
  <main>
    <section class="Register">
      <h1>Register</h1>
      <form action="#" method="POST">
        <label for="FirstName">First Name:</label>
        <input type="text" id="fName" name="fName"  required>

        <label for="Surname">Surname:</label>
        <input type="text" id="sName" name="sName" required>

        <label for="Phone">Phone Number:</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" >

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Create a password:</label>
        <input type="password" id="password" name="password" required>
        
        <label for="RepeatPassword">Confirm your Password:</label>
        <input type="password" id="rPassword" name="rPassword" required>
        
      </form>
      <div class="buttonContainer">
        <button type="button" class="registerButton">Register</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footerColumn">
      <h3>HATS FOR CATS</h3>
    </div>
    <div class="footerColumn">
      <h4>Home</h4>
      <ul>
        <li><a href="#">Shop</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Login</a></li>
      </ul>
    </div>
    <div class="footerColumn">
      <h4>Shop</h4>
      <ul>
        <li><a href="#">Browse Hats</a></li>
        <li><a href="#">Best Sellers</a></li>
        <li><a href="#">New Arrivals</a></li>
      </ul>
    </div>
    <div class="footerColumn">
      <h4>Contact</h4>
      <ul>
        <li><a href="#">Email</a></li>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Instagram</a></li>
        <li><a href="#">Twitter</a></li>
      </ul>
    </div>
    <div class="footerColumn newsletter">
      <h4>Join Our Newsletter</h4>
      <form action="#">
        <div class="inputContainer">
          <input type="email" placeholder="Email Address" required>
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>    
  </footer>
</body>
</html>
