<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Summary</title>
    <link rel="stylesheet" href="empty.basket.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>BASKET</h1>
        <div class="header-info">
            <span>0 ITEMS</span>
            <span>WISHLIST</span>
        </div>
    </header>

    <!-- Main Content Section -->
    <div class="content-container">
        <!-- Summary Section -->
        <div class="basket-summary">
            <h2>SUMMARY</h2>
            <p>
                <span>Subtotal</span>
                <span>£0.00</span>
            </p>
            <p>
                <span>Shipping Fee</span>
                <span>£0.00</span>
            </p>
            <p>
                <span>Discount Code</span>
                <span>£0.00</span>
            </p>
            <input type="text" placeholder="Enter discount code">
            <div class="total">
                <span>Total</span>
                <span>£0.00</span>
            </div>
            <button class="checkout-btn">Continue to checkout</button>
        </div>
    </div>

</body>
</html>
