<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Pop Up</title>
    <link rel="stylesheet" href="basketpopup.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="basket-container">
        <img src="media/basket.png" alt="Basket" class="basket-icon" id="BasketIcon">
    </div>
    <div class="basket-popup" id="BasketPopUp">
        <div class="basket-header">
            <h1>Your Basket</h1> 
        </div>
        <div class="basket-items" id="CartItems">
            <div class="cart-item">
                <img src="https://via.placeholder.com/192x148/FFFFFF" alt="Product 1" class="cart-item-img">
                <div class="cart-item-information">
                    <div class="cart-item-information-header">
                        <div class="cart-item-name">
                            Product 1
                        </div>
                        <div class="cart-item-price">
                            £3.99
                        </div>
                    </div>
                    <div class="cart-item-information-sub">
                        <div class="cart-item-size">
                            Size: M
                        </div>
                        <div class="cart-item-colour">
                            Colour: Red
                        </div>
                    </div>
                </div>
            </div>
            <div class="cart-item">
                <img src="https://via.placeholder.com/192x148/FFFFFF" alt="Product 2" class="cart-item-img">
            </div>
            <div class="cart-item">
                <img src="https://via.placeholder.com/192x148/FFFFFF" alt="Product 3" class="cart-item-img">
            </div>
        </div>
        <div class="basket-summary">
            <span class="total-label">Total:</span>
            <span class="total-price-value" id="totalPrice">£ 7.99</span>          
        </div>
        <div class="button-container">
            <button class="wishlist-button">Wishlist</button>
            <button class="checkout-button">Checkout</button>
        </div>
        <span class="close" id="ClosePopUp">x</span>
    </div>
    <script src="basketpopup.js"></script>
</body>
</html>
