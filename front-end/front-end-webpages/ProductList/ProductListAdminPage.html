<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="ProductListAdminPage.css">
</head>
<body>

    <div class="dashboard">
        
        <aside class="sidebar">
            <h2>Hats for Cats</h2>
        </aside>

        <main class="content">
            <header>
                <h1>Product List</h1>
                
            </header>
           
                </select>
                <div class="discount-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>No. of Variants</th>
                            <th>Total Stock</th>
                            <th>Stock Alert</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Regular Hat</td>
                            <td>Black</td>
                            <td>4</td>
                            <td>90</td>
                            <td class="valid">&check;</td>
                            <td><span class="action">VIEW</span> | <span class="action">EDIT</span></td>
                        </tr>
                        <tr>
                            <td>Regular Hat</td>
                            <td>Grey</td>
                            <td>4</td>
                            <td>102</td>
                            <td class="valid">&check;</td>
                            <td><span class="action">VIEW</span> | <span class="action">EDIT</span></td>
                        </tr>
                        <tr>
                            <td>Halloween Hat</td>
                            <td>Orange</td>
                            <td>5</td>
                            <td>21</td>
                            <td class="expired">!</td>
                            <td><span class="action">VIEW</span> | <span class="action">EDIT</span></td>
                        </tr>
                        <tr>
                            <td>Christmas Hat</td>
                            <td>Red</td>
                            <td>6</td>
                            <td>31</td>
                            <td class="expired">!</td>
                            <td><span class="action">VIEW</span> | <span class="action">EDIT</span></td>
                        </tr>
                    </tr>
                   
                    <tr class="empty-row">
                        <td>.</td>
                        <td colspan="6"></td>
                        
                    </tr>
                    </tbody>
                </table>
                
            </div>

          
        </main>
    </div>
</body>
</html>
