<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Head Avatar 2</title>
    <link rel="stylesheet" href="../css/catheadavatar.css">
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // Set up scene, camera, and renderer
    const scene = new THREE.Scene();

    // Create a camera with an aspect ratio based on the full window size.
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 2.5);
    // Optional: make the camera look towards the center where the model will be positioned.
    camera.lookAt(0, 0, 0);

    // Create renderer, set its size and background color
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Set the renderer's clear color to match your background
    renderer.setClearColor(0xE5F4FF);

    // Enable color management
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.physicallyCorrectLights = true;

    document.body.appendChild(renderer.domElement);

    // Add lighting
    const light = new THREE.HemisphereLight(0xffffff, 0x444444);
    light.position.set(0, 20, 0);
    scene.add(light);

    // Add Ambient Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // 1 is the intensity
    scene.add(ambientLight);

    // Load your 3D model
    const loader = new THREE.GLTFLoader();
    let model;
    loader.load('../media/models/cathead2.glb', (glb) => {
      model = glb.scene;

      // Increase the model's size (e.g., double its size)
      model.scale.set(3.5, 3.5, 3.5);

        // Compute the model's bounding box
        const box = new THREE.Box3().setFromObject(model);
        const center = new THREE.Vector3();
        box.getCenter(center);

        // Reposition the model so that its center is at (0, 0, 0)
        // Subtract the computed center from the model's current position
        model.position.sub(center);

        // Then apply any additional positioning (e.g., move it further down)
        model.position.y -= 0.3;

      scene.add(model);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Update model rotation on mousemove
    document.addEventListener('mousemove', (e) => {
      if (!model) return;
      // Normalize mouse coordinates (-0.5 to 0.5)
      const mouseX = (e.clientX / window.innerWidth) - 0.5;
      const mouseY = (e.clientY / window.innerHeight) - 0.5;
      // Adjust these multipliers for the desired effect
      const rotationY = mouseX * Math.PI * 0.5;
      const rotationX = mouseY * Math.PI * 0.5;
      // Update the model's rotation so it faces the mouse direction.
      model.rotation.y = rotationY;
      model.rotation.x = rotationX;
    });

    // Ensure the renderer and camera are updated if the window size changes
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
